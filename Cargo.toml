[package]
name = "radiko-recorder"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Radiko live radio scheduling, recording and preview in a terminal"
license = "MIT"

[profile.release]
# Keep line information for crash reports in the double-clickable Windows build.
debug = 1

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
fs2 = "0.4"
futures-util = "0.3"
quick-xml = { version = "0.41", features = ["serialize"] }
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.13", features = ["rustls"], default-features = false }
rodio = { version = "0.21", default-features = false, features = ["playback"] }
scraper = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
axum = "0.8"
